# Runtime patch for configs/word_rows_2layer_delayed_temporal_pooling_text.yaml.
# Layer 0 is intentionally left unchanged; Layer 1 temporal pooling is enabled.

layers:
  - {}
  - temporal_pooling:
      enabled: true
      enable_persistence: false
      delay_length: 16
      spatial_permanence_inc: 0.12
      active_predict_proximal_scale: 4.0
      predictive_non_active_proximal_scale: 0.3
      post_active_proximal_scale: 1.0
      sequence_permanence_inc: 0.5
      sequence_permanence_dec: 0.001
