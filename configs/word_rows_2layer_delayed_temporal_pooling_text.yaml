# Two-Layer Word-Row Text HTM Configuration with delayed temporal pooling
# Layer 0: word-row sensory layer (same as word_rows_text.yaml).
# Layer 1: abstraction layer starts with temporal pooling disabled, then the
#          runtime override below enables it at timestep 1000.

text:
  mode: word_rows

encoder:
  letter_bits: 8
  alphabet: "abcdefghijklmnopqrstuvwxyz"

enable_feedback: false

runtime_parameter_schedule:
  - at_timestep: 1000
    override: overrides/word_rows_2layer_enable_temporal_pooling.yaml

layers:
  # Layer 0 - Sensory layer (one row per character position in the word)
  - name: Layer0_WordRows
    input:
      rows: 5
      cols: 216               # letter_bits * (26 + 1) = 216
    columns:
      rows: 5
      cols: 56
    overlap:
      pot_width: 216
      pot_height: 1
      center_pot_synapses: true
      connected_perm: 0.3
      min_overlap: 4
      min_potential_overlap: 1
      wrap_input: true
    inhibition:
      width: 36
      height: 1
      desired_local_activity: 1
      strict_local_activity: false
    spatial_learning:
      permanence_inc: 0.08
      permanence_dec: 0.04
      active_col_permanence_dec: 0.04
    sequence_memory:
      cells_per_column: 3
      max_segments_per_cell: 3
      max_synapses_per_segment: 12
      min_num_syn_threshold: 2
      new_syn_permanence: 0.3
      connect_permanence: 0.2
      activation_threshold: 7
      permanence_inc: 0.08
      permanence_dec: 0.04
    temporal_pooling:
      enabled: false
      delay_length: 1

  # Layer 1 - Abstraction layer with wide receptive fields over Layer 0.
  # pot_width covers the full column width (168) and pot_height covers all
  # 5 rows so every Layer 1 column can potentially connect to any Layer 0
  # column. Temporal pooling starts disabled so sequence memory can form first;
  # configs/overrides/word_rows_2layer_enable_temporal_pooling.yaml enables it
  # at timestep 1000 using the tuned values below.
  - name: Layer1_Abstraction
    columns:
      rows: 5
      cols: 40
    overlap:
      pot_width: 168
      pot_height: 5
      center_pot_synapses: true
      connected_perm: 0.3
      min_overlap: 3
      min_potential_overlap: 1
      wrap_input: true
    inhibition:
      width: 40
      height: 5
      desired_local_activity: 12
      strict_local_activity: false
    spatial_learning:
      permanence_inc: 0.06
      permanence_dec: 0.01
      active_col_permanence_dec: 0.01
    sequence_memory:
      cells_per_column: 4
      max_segments_per_cell: 6
      max_synapses_per_segment: 20
      min_num_syn_threshold: 3
      new_syn_permanence: 0.1
      connect_permanence: 0.2
      activation_threshold: 6
      permanence_inc: 0.06
      permanence_dec: 0.04
    temporal_pooling:
      enabled: false
      enable_persistence: true
      delay_length: 8
      spatial_permanence_inc: 0.04
      active_predict_proximal_scale: 0.25
      predictive_non_active_proximal_scale: 0.0
      post_active_proximal_scale: 0.0
      sequence_permanence_inc: 0.2
      sequence_permanence_dec: 0.004
